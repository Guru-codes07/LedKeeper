# config/ledkeeper.conf
# ledkeeper.conf - LedKeeper configuration
#
# Expected location: ~/.config/ledkeeper/config
#
# Simple "key=value" format, one setting per line. Lines starting
# with '#' are comments. Every setting here has a CLI flag
# equivalent (see `ledkeeper --help`); an explicit CLI flag, when
# given, overrides whatever is set here.
#
# NOTE: this file is a template only as of this stage of the
# project - main.c does not yet read it. See the project notes for
# what's needed to wire it up.

# How often (in milliseconds) to check whether the kernel has reset
# the LED. Lower = more responsive restoration, slightly more CPU
# wakeups. Equivalent to no current CLI flag; would map to
# daemon_config_t.poll_interval_ms. Default if unset: 200.
poll_interval_ms=200

# Explicit sysfs path to the LED directory, bypassing auto-detection.
# Leave blank/commented to auto-detect the Scroll Lock LED.
# Equivalent to --led-path PATH.
# led_path=/sys/class/leds/input3::scrolllock

# Enable verbose logging (every LED restore event gets logged, not
# just failures). Equivalent to -v / --verbose. Values: true / false.
verbose=false

NOTE:
main.c doesn't actually read a config file yet — right now it's CLI-flags-only (--led-path, --verbose, etc.)
So this file would just be a documentation of what the config file would look like if it were implemented. 
The CLI flags are the only way to configure ledkeeper at this time.
